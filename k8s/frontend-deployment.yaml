apiVersion: apps/v1
kind: Deployment
metadata:
  name: gorisk-frontend-deployment
  labels:
    app: gorisk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gorisk-frontend
  template:
    metadata:
      labels:
        app: gorisk-frontend
    spec:
      containers:
      - name: gorisk-frontend
        image: tu-usuario-dockerhub/gorisk-frontend:latest
        ports:
        - containerPort: 80 # Nginx expone el puerto 80 dentro del contenedor
---
apiVersion: v1
kind: Service
metadata:
  name: gorisk-frontend-service
spec:
  type: LoadBalancer # AWS EKS aprovisionará un Elastic Load Balancer (ELB) clásico o de red
  selector:
    app: gorisk-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
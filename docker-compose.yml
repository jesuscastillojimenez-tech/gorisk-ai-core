services:
  # ==========================================
  # 1. BASES DE DATOS Y CACHÉ
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: gorisk-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gorisk_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:6-jammy
    container_name: gorisk-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:alpine
    container_name: gorisk-redis
    ports:
      - "6379:6379"

  # ==========================================
  # 2. APACHE KAFKA (KRaft Mode)
  # ==========================================
  kafka:
    image: confluentinc/confluent-local:7.7.0
    container_name: gorisk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      # ¡Ajuste Clave! PLAINTEXT apunta a 'kafka' para que Go lo encuentre dentro de la red Docker.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # ==========================================
  # 3. BACKEND (Go API)
  # ==========================================
  api:
    build:
      context: ./gorisk-ai-core
      dockerfile: Dockerfile
    container_name: gorisk-api
    restart: on-failure      # <--- SOLUCIÓN A LA CONDICIÓN DE CARRERA
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
      - redis
      - kafka
    environment:
      # Sobrescribimos el .env local con los nombres de los contenedores
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=gorisk_db
      - DB_SSLMODE=disable
      - MONGO_URI=mongodb://mongodb:27017/
      - REDIS_ADDR=redis:6379 
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=risk_evaluations_events
      # La API Key de Gemini se pasa desde el entorno de tu computadora por seguridad
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  # ==========================================
  # 4. FRONTEND (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
    container_name: gorisk-frontend
    ports:
      - "5173:80" # Mapea el puerto local 5173 al puerto 80 del Nginx del contenedor
    depends_on:
      - api

# Declaración de volúmenes persistentes
volumes:
  pgdata:
  mongodata: